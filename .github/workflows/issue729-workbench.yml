name: Issue 729 Workbench
on:
  push:
    branches: [feat/agent-v2-party-cohorts-729]
    paths: [.github/workflows/issue729-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Archive locked dependencies only
        run: find . -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/issue729-dependencies.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue729-dependencies
          path: /tmp/issue729-dependencies.tar.gz
          retention-days: 1
