name: Agent v2 / Apply reviewed integration
on:
  push:
    branches: [feat/agent-v2-dialogue-history-736]
    paths: [.github/workflows/issue729-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/agent-v2-dialogue-history-736'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Verify integrated source blobs and publish to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 53cb96b33848e7103275a16ab41d24a1b744c4a2
          cat .github/issue729-transfer/0.patch .github/issue729-transfer/1.patch .github/issue729-transfer/2.patch > /tmp/dialogue.patch
          echo '74d24019fa80338f542f1f53043c5b20cecffece04fc9d8abda27d3baea9fccb  /tmp/dialogue.patch' | sha256sum -c -
          git apply --index --unidiff-zero --check /tmp/dialogue.patch
          git apply --index --unidiff-zero /tmp/dialogue.patch
          python3 - <<'PY'
          import pathlib, subprocess
          patch = pathlib.Path('/tmp/dialogue.patch').read_text()
          count = 0
          for part in patch.split('diff --git ')[1:]:
              lines = part.splitlines()
              path = next(line[6:] for line in lines if line.startswith('+++ b/'))
              after = next(line.split('..')[1].split()[0] for line in lines if line.startswith('index '))
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == after, path
              count += 1
          assert count == 16, count
          print('All integrated source blobs match the tested files.')
          PY
          git rm -r .github/issue729-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '🔀 mainの診断改善と自由文textの契約を統合する'
          git push origin HEAD:refs/heads/feat/agent-v2-dialogue-history-736
