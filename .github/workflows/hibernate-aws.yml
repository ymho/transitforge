name: AWS / Hibernate TransitForge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hibernate-aws.yml
      - tools/deployment/hibernate-aws.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transitforge-dev
  cancel-in-progress: false

jobs:
  hibernate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_PAGER: ""

    steps:
      - name: Check out hibernation procedure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate safe AWS target
        shell: bash
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?AWS_DEPLOY_ROLE_ARN is required}"
          : "${TF_STATE_BUCKET:?TF_STATE_BUCKET is required}"
          test "$AWS_REGION" = "ap-northeast-1"

      - name: Set up Terraform (remote state read only)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Assume the scoped dev deployment role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Suspend scheduled work, serving, Fargate and NAT
        shell: bash
        run: bash tools/deployment/hibernate-aws.sh
