name: CD / Deploy

on:
  workflow_run:
    workflows:
      - CI / Test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only (no AWS changes), or deploy after validation
        type: choice
        options: [plan, deploy]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: transitforge-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      CD_MODE: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.mode || 'plan' }}
      TF_VAR_enable_fixed_egress_provider: ${{ vars.FIXED_EGRESS_PROVIDER_ENABLED }}
      # #706: development-service cutover, not a general-availability quality gate.
      # #785: independently verified consultation flow, native adaptive thinking/medium.
      TF_VAR_bedrock_model_id: "jp.anthropic.claude-sonnet-4-6"
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_data_builder_github_oidc_subject: ${{ vars.DATA_BUILDER_GITHUB_OIDC_SUBJECT }}
      TF_VAR_cloudflare_front_door_enabled: ${{ vars.CLOUDFLARE_FRONT_DOOR_ENABLED || 'false' }}
      TF_VAR_legacy_cloudfront_redirect_enabled: ${{ vars.LEGACY_CLOUDFRONT_REDIRECT_ENABLED || 'false' }}

    steps:
      - name: Check out verified revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment inputs
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?dev Environment variable AWS_DEPLOY_ROLE_ARN is required}"
          : "${TF_STATE_BUCKET:?dev Environment variable TF_STATE_BUCKET is required}"
          : "${TF_VAR_data_builder_github_oidc_subject:?dev Environment variable DATA_BUILDER_GITHUB_OIDC_SUBJECT is required}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate deployment safety inputs
        run: node tools/deployment/cutover-gates.mjs inputs

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build viewer with deployment token
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_ACCOMMODATION_PROVIDER_DISPLAY_NAME: ${{ vars.ACCOMMODATION_PROVIDER_DISPLAY_NAME }}
          VITE_ACCOMMODATION_PROVIDER_CREDIT_URL: ${{ vars.ACCOMMODATION_PROVIDER_CREDIT_URL }}
          VITE_ACCOMMODATION_PROVIDER_CREDIT_IMAGE_URL: ${{ vars.ACCOMMODATION_PROVIDER_CREDIT_IMAGE_URL }}
          VITE_ACCOMMODATION_PROVIDER_CREDIT_ALT: ${{ vars.ACCOMMODATION_PROVIDER_CREDIT_ALT }}

      - name: Validate Lambda package
        run: npm run lambda:check --workspace @raiquora/agent-api

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore Terraform provider cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-1.12.2-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-1.12.2-

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Plan Terraform without exposing values
        working-directory: infra/terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$CD_MODE" in plan|deploy) ;; *) exit 1 ;; esac
          lock=true
          if [ "$CD_MODE" = plan ]; then lock=false; fi
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=${lock}"
          if ! terraform plan -input=false -lock="$lock" -out=dev.tfplan > plan.log 2>&1; then
            echo "Terraform plan failed; raw diagnostics are withheld because they may contain sensitive values."
            exit 1
          fi
          terraform show -json dev.tfplan | node ../../../../tools/deployment/cutover-gates.mjs plan > plan-summary.txt
          cat plan-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Apply validated Terraform plan
        if: env.CD_MODE == 'deploy'
        working-directory: infra/terraform/environments/dev
        run: terraform apply -input=false -auto-approve dev.tfplan

      - name: Remove detached legacy Basic auth function
        if: env.CD_MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          # Terraform has waited for the distributions to deploy without this
          # association. Deleting the function earlier returns FunctionInUse.
          if etag=$(aws cloudfront describe-function --name transitforge-dev-basic-auth --stage LIVE --query ETag --output text 2>&1); then
            aws cloudfront delete-function --name transitforge-dev-basic-auth --if-match "$etag"
          elif [[ "$etag" != *NoSuchFunctionExists* && "$etag" != *FunctionNotFound* ]]; then
            printf '%s\n' "$etag" >&2
            exit 1
          fi

      - name: Read deployment outputs
        if: env.CD_MODE == 'deploy'
        id: terraform
        working-directory: infra/terraform/environments/dev
        run: |
          echo "website_bucket=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "agent_stream_log_group=$(terraform output -raw agent_stream_log_group_name)" >> "$GITHUB_OUTPUT"
          echo "agent_stream_function=$(terraform output -raw agent_stream_function_name)" >> "$GITHUB_OUTPUT"
          echo "otp_bridge_function=$(terraform output -json otp_route_service | jq -r '.bridge_arn | split(":")[-1]')" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Agent runtime
        if: env.CD_MODE == 'deploy'
        env:
          AGENT_STREAM_FUNCTION: ${{ steps.terraform.outputs.agent_stream_function }}
        shell: bash
        run: |
          set -euo pipefail
          aws lambda wait function-updated-v2 --function-name "$AGENT_STREAM_FUNCTION"
          aws lambda get-function-configuration \
            --function-name "$AGENT_STREAM_FUNCTION" \
            --query '{state:State,updateStatus:LastUpdateStatus,runtime:Environment.Variables.AGENT_RUNTIME,legacyV2:Environment.Variables.AGENT_RUNTIME_V2_ENABLED,legacySemantic:Environment.Variables.SEMANTIC_INTENT_ENABLED,modelId:Environment.Variables.MODEL_ID}' \
            --output json | node tools/deployment/verify-agent-runtime.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed OTP route service
        if: env.CD_MODE == 'deploy'
        env:
          OTP_BRIDGE_FUNCTION: ${{ steps.terraform.outputs.otp_bridge_function }}
        shell: bash
        run: |
          set -euo pipefail
          request='{"origin":{"name":"出雲市駅","latitude":35.36092,"longitude":132.75640},"destination":{"name":"出雲科学館","latitude":35.36104,"longitude":132.77344},"departureAt":"2026-10-01T10:00:00+09:00","mode":"walk"}'
          for attempt in $(seq 1 18); do
            rm -f otp-invoke.json otp-response.json
            if aws lambda invoke \
              --function-name "$OTP_BRIDGE_FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload "$request" \
              otp-response.json > otp-invoke.json; then
              function_error=$(jq -r '.FunctionError // ""' otp-invoke.json)
              status=$(jq -r '.status // ""' otp-response.json 2>/dev/null || true)
              if [ -z "$function_error" ] &&
                jq -e '.status == "available" and (.routes | length > 0) and
                  .coverage.serviceStart == "2026-10-01" and
                  .coverage.serviceEnd == "2026-10-31"' otp-response.json > /dev/null; then
                {
                  echo "### OTP route smoke"
                  echo "- Bridge Lambda: ready"
                  echo "- Pinned graph coverage: 2026-10-01 to 2026-10-31"
                  echo "- Walking route: available"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ -z "$function_error" ] && [ "$status" != "unavailable" ] && [ -n "$status" ]; then
                echo "OTP returned unexpected validated status: $status" >&2
                exit 1
              fi
            fi
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          echo "OTP route bridge did not return an available walking route." >&2
          exit 1

      - name: Summarize recent Agent failures without conversation content
        if: env.CD_MODE == 'deploy'
        env:
          AGENT_STREAM_LOG_GROUP: ${{ steps.terraform.outputs.agent_stream_log_group }}
        run: |
          set -euo pipefail
          start_time="$(( ($(date +%s) - 7200) * 1000 ))"
          aws logs filter-log-events \
            --log-group-name "$AGENT_STREAM_LOG_GROUP" \
            --start-time "$start_time" \
            --filter-pattern '"agent_diagnostic"' \
            --query 'events[].message' \
            --output json > agent-diagnostics.json
          aws logs filter-log-events \
            --log-group-name "$AGENT_STREAM_LOG_GROUP" \
            --start-time "$start_time" \
            --filter-pattern '"agent_stream"' \
            --query 'events[].message' \
            --output json > agent-stream-events.json
          aws logs filter-log-events \
            --log-group-name "$AGENT_STREAM_LOG_GROUP" \
            --start-time "$start_time" \
            --filter-pattern '"agent_model_response_rejected"' \
            --query 'events[].message' \
            --output json > agent-model-shapes.json
          node tools/deployment/summarize-agent-diagnostics.mjs \
            agent-diagnostics.json agent-stream-events.json agent-model-shapes.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate public authentication configuration
        if: env.CD_MODE == 'deploy'
        working-directory: infra/terraform/environments/dev
        run: terraform output -json cognito_frontend_config > ../../../../dist/auth-config.json

      - name: Deploy viewer assets
        if: env.CD_MODE == 'deploy'
        run: |
          aws s3 sync dist "s3://${{ steps.terraform.outputs.website_bucket }}/" \
            --delete \
            --exclude "viewer-input/*" \
            --exclude "api/*"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.terraform.outputs.distribution_id }}" \
            --paths "/*"

      - name: Remove sensitive local plan files
        if: always()
        working-directory: infra/terraform/environments/dev
        run: rm -f dev.tfplan plan.log
