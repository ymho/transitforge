name: Agent Eval / Strands v2 Live

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Strands v2 evaluation case
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "tool-grounding"
          - "write-not-available"
      repetitions:
        description: Independent repetitions per case
        required: true
        default: "1"
        type: choice
        options: ["1", "3"]
      model_id:
        description: Bedrock model for Agent v2
        required: true
        default: "amazon.nova-lite-v1:0"
        type: choice
        options:
          - "amazon.nova-lite-v1:0"
          - "jp.amazon.nova-2-lite-v1:0"

permissions:
  contents: read

concurrency:
  group: transitforge-strands-v2-live
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: ${{ inputs.model_id }}
      CASE_ID: ${{ inputs.case_id }}
      REPETITIONS: ${{ inputs.repetitions }}

    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve the dedicated evaluation role
        id: eval-role
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?dev Environment variable AWS_DEPLOY_ROLE_ARN is required}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "role_arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ steps.eval-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install and validate deterministic evaluator
        run: |
          npm ci
          npm run typecheck:tools
          npm run test:agent:strands:live-fixtures

      - name: Fix bounded execution budget
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPETITIONS" =~ ^(1|3)$ ]]
          case "$CASE_ID" in
            all) cases=2 ;;
            tool-grounding|write-not-available) cases=1 ;;
            *) echo "Invalid CASE_ID: $CASE_ID" >&2; exit 2 ;;
          esac
          maximum_calls=$((cases * REPETITIONS * 4))
          echo "maximum_calls=$maximum_calls" >> "$GITHUB_OUTPUT"
          {
            echo "### Strands v2 Live Eval budget"
            echo "- Model: $MODEL_ID"
            echo "- Case selection: $CASE_ID"
            echo "- Cases: $cases"
            echo "- Repetitions: $REPETITIONS"
            echo "- Maximum model calls: $maximum_calls"
            echo "- Maximum Tool calls per case: 1"
            echo "- Deadline per case: 60s"
            echo "- External Travel Providers: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Strands v2 live evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/strands-v2-live
          args=(--repetitions "$REPETITIONS" --output-dir .artifacts/strands-v2-live --require-all)
          if [[ "$CASE_ID" != "all" ]]; then args+=(--case "$CASE_ID"); fi
          npm run eval:agent:strands:live -- "${args[@]}"

      - name: Publish bounded summary
        if: always()
        shell: bash
        run: |
          if [[ -f .artifacts/strands-v2-live/report.json ]]; then
            jq '{modelId,region,repetitions,maximumModelCalls,observedModelCalls,stablePassed,cases,results:[.results[]|{caseId,attempt,passed,failures,metrics:{status:.observation.status,deliveryBasis:.observation.deliveryBasis,toolCalls:.observation.toolCalls,evidenceCount:.observation.evidenceCount,modelCalls:.observation.modelCalls,inputTokens:.observation.inputTokens,outputTokens:.observation.outputTokens,durationMs:.observation.durationMs}}]}' .artifacts/strands-v2-live/report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload private evaluation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strands-v2-live-${{ github.run_id }}
          path: .artifacts/strands-v2-live
          if-no-files-found: warn
          retention-days: 14
