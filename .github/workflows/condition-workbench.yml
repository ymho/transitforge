name: Condition workbench (temporary)
on:
  push:
    branches: [feat/716-condition-operations]
    paths: [.github/workflows/condition-workbench.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npm run typecheck --workspace @raiquora/agent-api && npm run test:agent:v2
  model:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: amazon.nova-lite-v1:0
            repetitions: 1
          - model: jp.amazon.nova-2-lite-v1:0
            repetitions: 3
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: ${{ matrix.model }}
      REPETITIONS: ${{ matrix.repetitions }}
      AGENT_V2_LIVE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - name: Resolve existing Bedrock-only evaluation role
        id: role
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?missing role configuration}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"
          echo "Budget: $REPETITIONS independent repetitions of 7 x 8 cycles + 4 x 6 cycles. Fixed Providers/test state, 2 reads/60s per turn." >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Repeat both independent checks without hiding any failed attempt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/conditions
          status=0
          for ((attempt=1; attempt<=REPETITIONS; attempt++)); do
            npm run test:agent:v2:condition-live -- --reporter=default --reporter=json --outputFile=".artifacts/conditions/small-${attempt}.json" || status=1
            npm run test:agent:v2:conversation-live -- --reporter=default --reporter=json --outputFile=".artifacts/conditions/conversation-${attempt}.json" || status=1
          done
          for file in .artifacts/conditions/*.json; do
            echo "$(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
            jq '{success,numPassedTests,numFailedTests,numPendingTests}' "$file" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
