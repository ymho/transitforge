name: Condition workbench (temporary)
on:
  push:
    branches: [feat/716-condition-operations]
    paths: [.github/workflows/condition-workbench.yml]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        model: [amazon.nova-lite-v1:0, jp.amazon.nova-2-lite-v1:0]
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: ${{ matrix.model }}
      AGENT_V2_LIVE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve existing Bedrock-only evaluation role
        id: role
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?missing role configuration}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"
          echo 'Budget per model: 7 turns x 8 cycles, 2 reads/60s per turn. Test state and fixed read results only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify small Tools without duplicate capability declarations
        run: npx vitest run --root . backend/agent-api/src/composition/strands-condition-tools-live.test.ts --maxWorkers=1
