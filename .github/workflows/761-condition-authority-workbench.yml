name: Trip conditions / Reviewed boundary verification
on:
  push:
    branches: [feat/761-trip-condition-authority]
    paths: [.github/workflows/761-condition-authority-workbench.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/feat/761-trip-condition-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Apply the locally reproduced and tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/761-trip-condition-authority
          test "$(git rev-parse HEAD^)" = a5849c72455bdc46e99684c6cae12cf323f593c4
          test "$(git hash-object backend/agent-api/src/adapters/strands-agent-engine.ts)" = 71368ed1fe4dd3b5b9d90b0892472f228c84ca87
          test "$(git hash-object backend/agent-api/src/adapters/strands-agent-engine.test.ts)" = ef893d485f3cb5c2c81fe32abcf0e02d18920c94
          git apply --check tools/761-condition-authority.patch
          git apply tools/761-condition-authority.patch
          test "$(git hash-object backend/agent-api/src/adapters/strands-agent-engine.ts)" = bf5fb84d45d658a05dbe15ea0ade26ade317081a
          test "$(git hash-object backend/agent-api/src/adapters/strands-agent-engine.test.ts)" = e57234a1d7cbf90c528f799cebdf59fc1b416952
          git rm tools/761-condition-authority.patch .github/workflows/761-condition-authority-workbench.yml
          git add backend/agent-api/src/adapters/strands-agent-engine.ts backend/agent-api/src/adapters/strands-agent-engine.test.ts
          git diff --cached --check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify real SDK boundary and Application admission
        run: npx vitest run backend/agent-api/src/adapters/strands-agent-engine.test.ts backend/agent-api/src/usecases/agent/conversation-condition-application.test.ts
      - name: Check architecture and production build
        run: npm run architecture:check && npm run build
      - name: Verify existing V2 contracts without live providers
        run: npm run test:agent:v2
      - name: Publish only tested source to the same working branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/761-trip-condition-authority
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '🐛 条件更新の受理判定をApplicationへ戻す'
          git push origin HEAD:feat/761-trip-condition-authority
          git log -1 --format='%H' >> "$GITHUB_STEP_SUMMARY"
