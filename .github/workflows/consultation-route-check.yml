name: UI / Consultation route race check
on:
  push:
    branches: [feat/unified-consultation-entry]
    paths: [.github/workflows/consultation-route-check.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/unified-consultation-entry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the obsolete restore before invoking its navigation port
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/unified-consultation-entry
          python3 - <<'PY'
          from pathlib import Path
          f = Path('frontend/src/presentation/home/ai-first-shell.ts')
          s = f.read_text()
          old = 'void Promise.resolve().then(() => ports.consultTrip!(tripId)).then(() => {'
          new = '''void Promise.resolve().then(() => {
                    if (generation !== entryGeneration || !root.isConnected || !isSignedIn()) return;
                    return ports.consultTrip!(tripId);
                  }).then(() => {'''
          assert s.count(old) == 1
          f.write_text(s.replace(old, new))
          f = Path('frontend/src/presentation/home/ai-first-shell.test.ts')
          f.write_text(f.read_text() + '''
          it("does not start a queued Trip restore after the user already selected a new consultation", async () => {
            window.history.replaceState({ consultation: "trip", tripId: "trip-one" }, "", "#chat");
            const consultTrip = vi.fn(async () => {});
            const { shell, ports } = setup({ authState: signedIn, consultTrip });
            shell.navigate("chat");
            await Promise.resolve(); await Promise.resolve(); await Promise.resolve();
            expect(consultTrip).not.toHaveBeenCalled(); expect(ports.openChat).not.toHaveBeenCalled();
            expect(document.querySelector("main")!.dataset.consultationMode).toBe("landing");
            expect(window.history.state.tripId).toBeUndefined();
          });
          ''')
          PY
          npx vitest run frontend/src/presentation/home frontend/src/presentation/trip-plan/trip-workspace.test.ts frontend/src/usecases/trip-plan/trip-consultation-navigation.test.ts frontend/src/usecases/concierge/start-fresh-consultation.test.ts
          git rm .github/workflows/consultation-route-check.yml
          git add frontend/src/presentation/home/ai-first-shell.ts frontend/src/presentation/home/ai-first-shell.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '🛡️ 旧画面の旅程相談を遅れて開かない'
          git push origin HEAD:feat/unified-consultation-entry
          git log -1 --format='%H' >> "$GITHUB_STEP_SUMMARY"
