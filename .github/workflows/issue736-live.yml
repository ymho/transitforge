name: Agent v2 / Native reasoning comparison
on:
  push:
    branches: [feat/agent-v2-party-cohorts-729]
    paths: [.github/workflows/issue736-live.yml]
permissions:
  contents: read
concurrency:
  group: transitforge-strands-v2-live
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/feat/agent-v2-party-cohorts-729'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: jp.amazon.nova-2-lite-v1:0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate deterministic boundaries
        run: |
          npm ci
          npm run typecheck:tools
          npm run test:agent:v2
      - name: Resolve dedicated evaluation role
        id: role
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
      - name: Same six history turns with native low reasoning
        env:
          AGENT_V2_LIVE: 'true'
          NOVA_DIALOGUE_REASONING: low
        run: |
          mkdir -p .artifacts/issue736-low
          echo 'Comparison only: same model ID, prompt, Tools, six user turns, model maxTokens=1536, invocation output=4096, 6 calls/turn, 60s/turn. No production state or external Travel Providers.' >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --root . backend/agent-api/src/composition/strands-dialogue-history-live.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.artifacts/issue736-low/low.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue736-low-${{ github.run_id }}
          path: .artifacts/issue736-low
          retention-days: 14
          if-no-files-found: warn
