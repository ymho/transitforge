name: Agent v2 / Extract tested free dialogue
on:
  push:
    branches: [feat/agent-v2-free-dialogue-736]
    paths: [.github/workflows/free-dialogue-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/agent-v2-free-dialogue-736'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Extract only exact offline-tested files from pinned public source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9ac75713131a36ae92fd69e7f499ea015694e686
          git fetch --depth=1 origin 37e7b647d62d75879537980496e93ddb0dfc7b46
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          def source(p):
              return subprocess.check_output(['git','show','37e7b647d62d75879537980496e93ddb0dfc7b46:'+p],text=True)
          p='modules/agent/runtime/agent-v2-condition-display.ts'; s=source(p)
          s=s.replace('import type { PartyScopeCatalog } from "@raiquora/trip/party-cohorts";\n','').replace('import { partyCohortEditableValue } from "./party-cohort-context";\n','')
          s=s.replace(', party_details: "同行者の詳細"','')
          a=s.index('const schools ='); b=s.index('/** Display only',a); s=s[:a]+s[b:]
          s=s.replace('intent?: EffectiveIntent,\n  catalog?: PartyScopeCatalog','intent?: EffectiveIntent')
          s=s.replace('displayValue(fact.value, intent, catalog)','displayValue(fact.value)').replace('displayValue(value: IntentValue, intent: EffectiveIntent, catalog?: PartyScopeCatalog)','displayValue(value: IntentValue)')
          a=s.index('    case "party_cohorts":'); b=s.index('    case "unknown":',a); s=s[:a]+s[b:]; Path(p).write_text(s)
          p='modules/agent/runtime/agent-v2-condition-display.test.ts'; s=source(p).replace('import type { PartyScopeCatalog } from "@raiquora/trip/party-cohorts";\n',''); s=s[:s.index('it("renders anonymous scopes')]; Path(p).write_text(s)
          p='backend/agent-api/src/adapters/strands-server-runtime.ts'; s=Path(p).read_text()
          s='import { conditionDisplayLines } from "@raiquora/agent/agent-v2-condition-display";\nimport type { PublicSemanticReceipt } from "@raiquora/agent/public-semantic-receipt";\n'+s
          s=s.replace('    let run:', '    const conditionReceipts: PublicSemanticReceipt[] = [];\n    let run:')
          s=s.replace('...(input.conditionController ? { conditionController: input.conditionController } : {}),', '''...(input.conditionController ? { conditionController: { ...input.conditionController, apply: async change => {
                    const accepted = await input.conditionController!.apply(change);
                    conditionReceipts.push(structuredClone(accepted.receipt));
                    return accepted;
                  } } } : {}),'''.replace('                    ', '          ').replace('                  }', '        }'))
          orig=source(p); a=orig.index('      // The model\'s prose'); b=orig.index('      // Match the existing Conversation',a)
          s=s.replace('      // Match the existing Conversation',orig[a:b].replace(', input.conditionController?.scopeCatalog','')+'      // Match the existing Conversation'); Path(p).write_text(s)
          p='backend/agent-api/src/usecases/agent-v2-system-prompt.ts'; s=Path(p).read_text(); sl=source(p).splitlines()
          for prefix in ['  "consider_trip_scenarioの結果','  "条件update Toolのreceipt','  "説明・比較・推薦理由','  "短い挨拶やお礼']:
              old=next((l for l in s.splitlines() if l.startswith(prefix)),None)
              newprefix={'  "説明・比較・推薦理由':'  "answer/candidatesでの外部情報', '  "短い挨拶やお礼':'  "conversation・clarification・uncertaintyにもtext'}.get(prefix,prefix)
              new=next((l for l in sl if l.startswith(newprefix)),None)
              assert old and new, prefix
              s=s.replace(old,new)
          Path(p).write_text(s)
          p='backend/agent-api/src/adapters/strands-agent-engine.ts'; s=Path(p).read_text().replace('  maxOutputTokens?: number;','  /** Per model response, not cumulative invocation. */\n  maxOutputTokens?: number;\n  maxInvocationOutputTokens?: number;',1)
          s=s.replace('...(input.limits?.maxOutputTokens ?? this.options.maxOutputTokens','...(input.limits?.maxOutputTokens ?? this.options.maxInvocationOutputTokens').replace('? { outputTokens: input.limits?.maxOutputTokens ?? this.options.maxOutputTokens }','? { outputTokens: input.limits?.maxOutputTokens ?? this.options.maxInvocationOutputTokens }'); Path(p).write_text(s)
          p='backend/agent-api/src/adapters/strands-agent-engine.test.ts'; s=Path(p).read_text(); orig=source(p); s+='\n'+orig[orig.index('describe("independent model and invocation output limits"'):]; Path(p).write_text(s)
          p=Path('package.json'); d=json.loads(p.read_text()); d['scripts']['test:agent:v2']+=' modules/agent/runtime/agent-v2-condition-display.test.ts backend/agent-api/src/composition/strands-free-dialogue.test.ts'; d['scripts']['test:agent:v2:free-dialogue-live']='vitest run --root . backend/agent-api/src/composition/strands-free-dialogue.test.ts --maxWorkers=1'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          expected={
            'backend/agent-api/src/adapters/strands-agent-engine.test.ts':'ef893d485f3cb5c2c81fe32abcf0e02d18920c94',
            'backend/agent-api/src/adapters/strands-agent-engine.ts':'4e09ab1c0ef8bb50ec89138daea2079d4180c865',
            'backend/agent-api/src/adapters/strands-server-runtime.ts':'751e47a4cd60b6e89aca8f19ae9de8ea90fd6a54',
            'backend/agent-api/src/composition/strands-free-dialogue.test.ts':'0e1ca4a0aba63996fdd37b068edccafe22093db0',
            'backend/agent-api/src/usecases/agent-v2-system-prompt.ts':'f0a2f7fa1fd3d0c0c7b5839d6cf1e593b1a758d6',
            'modules/agent/runtime/agent-v2-condition-display.test.ts':'953af69fa6c14f0b26c94f3744e2d9c910d76d16',
            'modules/agent/runtime/agent-v2-condition-display.ts':'44bba353f3c352ecbe93796bd63b12329a8ca3c9',
            'package.json':'ac2d87dc27180030aa2b39908d321418365c503c',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          print('All extracted code blobs match the offline-tested files.')
          PY
          git add backend modules package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '💬 同行者writerとは独立した自由文と受理条件表示を実装する'
          git push origin HEAD:refs/heads/feat/agent-v2-free-dialogue-736
