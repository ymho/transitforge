name: Agent v2 / Apply native history transport
on:
  push:
    branches: [feat/agent-v2-free-dialogue-736]
    paths: [.github/workflows/free-dialogue-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/agent-v2-free-dialogue-736'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Apply exact offline-tested native SDK history transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 949bfa45ee3dd283fe26423af0b4a96a065f0a0f
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('backend/agent-api/src/adapters/strands-turn-input.ts')
          s=p.read_text(); s='import type { MessageData } from "@strands-agents/sdk";\n'+s
          marker='\nfunction withoutRequest('
          extra='''
          /** Preserve the Conversation's public user/assistant roles with the SDK's native
           * history input. The same sanitized projection enforces the combined 24k budget;
           * messages are removed from application data rather than duplicated in the prompt.
           * This is data transport, not semantic interpretation or another state store. */
          export function strandsConversationInput(input: ServerAgentRuntimeInput): { modelInput: string; history: MessageData[] } {
            const payload = JSON.parse(strandsTurnInput(input)) as {
              userMessage: string; application: { conversation: { messages?: unknown } | null };
            };
            const conversation = payload.application.conversation;
            const saved = conversation?.messages ?? [];
            if (!Array.isArray(saved)) throw new StrandsTurnInputError("invalid_input");
            const history: MessageData[] = saved.map((message: unknown) => {
              if (!message || typeof message !== "object" || !("role" in message) || !("text" in message) ||
                  (message.role !== "user" && message.role !== "assistant") || typeof message.text !== "string" || !message.text.trim()) {
                throw new StrandsTurnInputError("invalid_input");
              }
              return { role: message.role, content: [{ text: message.text }] };
            });
            if (conversation) delete conversation.messages;
            return { modelInput: JSON.stringify({ application: payload.application, userMessage: payload.userMessage }), history };
          }
          '''
          s=s.replace(marker,'\n'+extra+marker); p.write_text(s)
          p=Path('backend/agent-api/src/adapters/strands-agent-engine.ts');s=p.read_text().replace('type JSONSchema, type JSONValue, type Model,','type JSONSchema, type JSONValue, type Model, type MessageData,').replace('  modelInput?: string;','  modelInput?: string;\n  /** Public owner-scoped history; no raw SDK Tool results or internal reasoning. */\n  history?: MessageData[];').replace('      model: baseModel,','      model: baseModel,\n      ...(input.history?.length ? { messages: input.history } : {}),');p.write_text(s)
          p=Path('backend/agent-api/src/adapters/strands-server-runtime.ts');s=p.read_text().replace('import { strandsTurnInput }','import { strandsConversationInput }').replace('    const conditionReceipts:', '    const conversationInput = strandsConversationInput(input);\n    const conditionReceipts:').replace('modelInput: strandsTurnInput(input),','...conversationInput,');p.write_text(s)
          p=Path('backend/agent-api/src/usecases/agent-v2-system-prompt.ts');s=p.read_text().replace('application.conversation.messagesは会話履歴です。','過去のuser/assistantメッセージが会話履歴です。');p.write_text(s)
          p=Path('backend/agent-api/src/composition/strands-free-dialogue.test.ts');s=p.read_text().replace('const payload = JSON.parse((input[0]!.content[0] as { text: string }).text);\n      expect(payload.application.conversation.messages.at(-1).text).toContain("出発地");','const payload = JSON.parse((input.at(-1)!.content[0] as { text: string }).text);\n      expect(input[0]!.role).toBe("user");\n      expect((input[0]!.content[0] as { text: string }).text).toBe(messages[0]);\n      expect(input[1]!.role).toBe("assistant");\n      expect((input[1]!.content[0] as { text: string }).text).toContain("出発地");\n      expect(payload.application.conversation).not.toHaveProperty("messages");');p.write_text(s)
          p=Path('backend/agent-api/src/adapters/strands-server-runtime.test.ts');s=p.read_text().replace('import { createStrandsServerRuntime }','import { strandsConversationInput } from "./strands-turn-input.js";\nimport { createStrandsServerRuntime }');s+='''
          it("projects only public role/text into native SDK history without duplicating or weakening the context budget", () => {
            const input = runtimeInput();
            const conversation = { messages: [{ role: "user" as const, text: "出発地は次に伝えます。" },
              { role: "assistant" as const, text: "分かりました。" }] };
            const projected = strandsConversationInput({ ...input, userRequest: "大阪です。", context: { ...input.context, conversation } });
            expect(projected.history).toEqual(conversation.messages.map(({ role, text }) => ({ role, content: [{ text }] })));
            const payload = JSON.parse(projected.modelInput);
            expect(payload.userMessage).toBe("大阪です。");
            expect(payload.application.conversation).not.toHaveProperty("messages");
            expect(conversation.messages).toHaveLength(2);
            expect(() => strandsConversationInput({ ...input, context: { conversation: { messages: [
              { role: "user", text: "x".repeat(25000) } ] } } })).toThrow("context_budget");
            expect(() => strandsConversationInput({ ...input, context: { conversation: { messages: [
              { role: "system", text: "not a public conversation role" } as never ] } } })).toThrow("invalid_input");
          });
          ''';p.write_text(s)
          expected={
            'adapters/strands-turn-input.ts':'5d2808ac8a30c0cdc8e577108ee8edf5ae289485',
            'adapters/strands-agent-engine.ts':'71368ed1fe4dd3b5b9d90b0892472f228c84ca87',
            'adapters/strands-server-runtime.ts':'26681cda5b4754c91c4a6df8466e3c19e0848f98',
            'adapters/strands-server-runtime.test.ts':'491b451e5186f0494025a8b08a62ba790b7690fd',
            'usecases/agent-v2-system-prompt.ts':'fefce20ba02985d7bfb93e80be29b048bcfdbb11',
            'composition/strands-free-dialogue.test.ts':'94a6503dce8112b47091dcd4199da4305e94238b',
          }
          for path,sha in expected.items():
              path='backend/agent-api/src/'+path
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          print('All six blobs match the locally tested native history implementation.')
          PY
          git add backend/agent-api/src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '💬 公開会話履歴をSDK標準のuser/assistantメッセージとして渡す'
          git push origin HEAD:refs/heads/feat/agent-v2-free-dialogue-736
