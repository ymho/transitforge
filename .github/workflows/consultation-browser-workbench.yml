name: UI / Consultation browser verification
on:
  push:
    branches: [feat/unified-consultation-entry]
    paths: [.github/workflows/consultation-browser-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/unified-consultation-entry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Connect the reviewed fresh-consultation boundary and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/unified-consultation-entry
          python3 - <<'PY'
          from pathlib import Path
          f = Path('frontend/src/composition/viewer-composition.ts')
          s = f.read_text()
          s = 'import { startFreshConsultation } from "../usecases/concierge/start-fresh-consultation";\n' + s
          a, b = s.index('const createAndActivateConversation = async () => {'), s.index('const resetConsultation = () => {')
          s = s[:a] + s[b:]
          old = '''  if (!isSignedIn()) throw new Error("Authentication required");
            await createAndActivateConversation();
            aiGuideController.ask(prompt);'''
          new = '''  if (!isSignedIn()) throw new Error("Authentication required");
            if (!canLeaveConditions()) throw new Error("Navigation cancelled");
            const navigation = tripNavigation.cancel(), account = serverTripClient.sessionVersion();
            await startFreshConsultation(prompt, {
              create: () => conversationUi.create({}, false),
              activate: activateConversation,
              isCurrent: () => isSignedIn() && navigation === tripNavigation.version() && account === serverTripClient.sessionVersion(),
              currentConversationId: () => activeConversationSession.id,
              submit: value => aiGuideController.ask(value),
            });'''
          assert s.count(old) == 1
          f.write_text(s.replace(old, new))
          f = Path('frontend/src/presentation/home/product-shell.css')
          f.write_text('\n'.join(line for line in f.read_text().splitlines() if '.home-trip-copy button[data-trip-chat]' not in line) + '\n')
          f = Path('docs/product-brief.md')
          s = f.read_text()
          old = 'モバイルでは画面下部の共通メニューから探す 相談 旅程 運行 アカウントへ移る'
          new = '共通メニューは相談 旅程 運行 設定の4項目。相談は新規Heroを入口とし、既存旅程の継続相談は旅程画面から同じ相談画面を使う'
          assert s.count(old) == 1
          f.write_text(s.replace(old, new))
          f = Path('docs/architecture/unified-consultation-entry.md')
          f.write_text(f.read_text() + '\n## 再現可能なブラウザ確認\n\n`tools/verify_unified_consultation.mjs`はViteをlocalhostで起動し、実Shell・相談画面・Trip workspaceとCSSを固定メモリ状態で組み合わせる。1440px/390pxで新規Hero→送信→旅程→旅程の相談→旅程へ戻る→新規Heroを操作し、可視性・対象Trip・横溢れ・composerとメニューの重なりを検証して画像を保存する。実API/Bedrock/認証済み実ユーザーの検証とは分ける。`start-fresh-consultation.test.ts`は作成待ち・履歴読み込み待ちの両方で画面/アカウント変更後に送信しないことを確認する。\n')
          PY
          git rm .github/workflows/consultation-browser-workbench.yml
          git add frontend/src/composition/viewer-composition.ts frontend/src/presentation/home/product-shell.css docs/product-brief.md docs/architecture/unified-consultation-entry.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '🛡️ 新規相談の履歴取得後も送信対象を再確認する'
          git push origin HEAD:feat/unified-consultation-entry
          git log -1 --format='%H' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Targeted navigation tests
        run: npx vitest run frontend/src/presentation/home frontend/src/presentation/trip-plan/trip-workspace.test.ts frontend/src/usecases/trip-plan/trip-consultation-navigation.test.ts frontend/src/usecases/concierge/start-fresh-consultation.test.ts
      - name: Check modules and build
        run: npm run workspace:check && npm run architecture:check && npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/visual-tools --no-save playwright@1.63.0
          /tmp/visual-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual UI components and CSS with synthetic data
        env:
          PLAYWRIGHT_MODULE: /tmp/visual-tools/node_modules/playwright/index.mjs
        run: |
          npm run dev --workspace @raiquora/frontend -- --host 127.0.0.1 --port 5178 --strictPort > /tmp/consultation-vite.log 2>&1 &
          node tools/verify_unified_consultation.mjs .artifacts/unified-consultation
      - name: Upload bounded synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consultation-navigation-${{ github.run_id }}
          path: .artifacts/unified-consultation
          if-no-files-found: warn
          retention-days: 14
