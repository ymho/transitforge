name: Agent / Production Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-production-diagnostics.yml
      - tools/deployment/summarize-agent-diagnostics.mjs
      - tools/deployment/summarize-browser-agent-diagnostics.mjs
      - tools/deployment/summarize-agent-transport-diagnostics.mjs

permissions:
  contents: read

jobs:
  summarize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AGENT_STREAM_LOG_GROUP: /aws/lambda/transitforge-dev-agent-stream
      AGENT_GATEWAY_LOG_GROUP: /aws/apigateway/transitforge-dev-agent-stream
      PERSONAL_STATE_LOG_GROUP: /aws/lambda/transitforge-dev-agent-stream-personal-state
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Aggregate allowlisted diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          start_time="$(( ($(date +%s) - 7200) * 1000 ))"
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_diagnostic"' --query 'events[].message' --output json > agent-diagnostics.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_stream"' --query 'events[].{message:message,timestamp:timestamp}' --output json > agent-stream-events.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_model_response_rejected"' --query 'events[].message' --output json > agent-model-shapes.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_model_call"' --query 'events[].message' --output json > agent-model-calls.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_invocation_failed"' --query 'events[].message' --output json > agent-invocation-failures.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_tool_call"' --query 'events[].message' --output json > agent-tool-calls.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_reply_validation"' --query 'events[].message' --output json > agent-reply-validations.json
          node tools/deployment/summarize-agent-diagnostics.mjs \
            agent-diagnostics.json agent-stream-events.json agent-model-shapes.json agent-model-calls.json agent-invocation-failures.json agent-tool-calls.json agent-reply-validations.json | tee -a "$GITHUB_STEP_SUMMARY"
          aws logs filter-log-events --log-group-name "$PERSONAL_STATE_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"browser_agent_diagnostic"' --query 'events[].message' --output json > browser-agent-diagnostics.json
          node tools/deployment/summarize-browser-agent-diagnostics.mjs browser-agent-diagnostics.json | tee -a "$GITHUB_STEP_SUMMARY"
          aws logs filter-log-events --log-group-name "$AGENT_GATEWAY_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '{ $.status = "5*" }' --query 'events[].{message:message,timestamp:timestamp}' --output json > agent-gateway-events.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"REPORT RequestId"' --query 'events[].{message:message,timestamp:timestamp}' --output json > agent-lambda-reports.json
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '?INIT_REPORT ?ERROR ?Error ?"Task timed out" ?"signal: killed" ?"out of memory"' \
            --query 'events[].{message:message,timestamp:timestamp}' --output json > agent-lambda-system.json
          metric_start="$(date -u -d '2 hours ago' +%FT%TZ)"
          metric_end="$(date -u +%FT%TZ)"
          for metric in Invocations Errors Throttles ConcurrentExecutions; do
            statistic=Sum
            if [ "$metric" = ConcurrentExecutions ]; then statistic=Maximum; fi
            aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name "$metric" \
              --dimensions "Name=FunctionName,Value=${AGENT_STREAM_LOG_GROUP##*/}" \
              --start-time "$metric_start" --end-time "$metric_end" --period 60 --statistics "$statistic" \
              --output json > "agent-metric-${metric}.json"
          done
          jq -n --slurpfile invocations agent-metric-Invocations.json --slurpfile errors agent-metric-Errors.json \
            --slurpfile throttles agent-metric-Throttles.json --slurpfile concurrency agent-metric-ConcurrentExecutions.json \
            '{Invocations:$invocations[0],Errors:$errors[0],Throttles:$throttles[0],ConcurrentExecutions:$concurrency[0]}' > agent-lambda-metrics.json
          node tools/deployment/summarize-agent-transport-diagnostics.mjs \
            agent-gateway-events.json agent-lambda-reports.json agent-lambda-system.json agent-lambda-metrics.json | tee -a "$GITHUB_STEP_SUMMARY"
