name: Agent v2 / Temporary offline workspace
on:
  push:
    branches: [feat/agent-v2-party-cohorts-729]
    paths: [.github/workflows/issue729-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package tracked public source and locked dependencies only
        run: |
          mkdir -p /tmp/issue729-offline
          git archive --format=tar HEAD > /tmp/issue729-offline/source.tar
          tar -cf /tmp/issue729-offline/dependencies.tar node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue729-offline-workspace
          path: /tmp/issue729-offline/*.tar
          retention-days: 1
          if-no-files-found: error
