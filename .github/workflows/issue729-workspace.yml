name: Agent v2 / Temporary offline workspace
on:
  push:
    branches: [feat/agent-v2-party-cohorts-729]
    paths: [.github/workflows/issue729-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: feature
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: 9ac75713131a36ae92fd69e7f499ea015694e686
          path: main-source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: b4e496386c50e9b51d58af71c4378242d38accbc
          path: base-source
      - name: Package tracked source only; no credentials or runtime state
        run: |
          mkdir -p /tmp/issue729-offline
          git -C feature archive --format=tar HEAD > /tmp/issue729-offline/feature.tar
          git -C main-source archive --format=tar HEAD > /tmp/issue729-offline/main.tar
          git -C base-source archive --format=tar HEAD > /tmp/issue729-offline/base.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue729-source-snapshots
          path: /tmp/issue729-offline/*.tar
          retention-days: 1
          if-no-files-found: error
