name: Agent / Limit diagnosis workbench

on:
  push:
    branches: [debug/agent-v2-limit-20260927]
    paths: [.github/workflows/agent-limit-diagnosis-workbench.yml]

permissions:
  contents: read

concurrency:
  group: agent-limit-diagnosis-workbench
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/debug/agent-v2-limit-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AGENT_STREAM_LOG_GROUP: /aws/lambda/transitforge-dev-agent-stream
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Configure existing credentials for log reads only
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Read six-hour diagnostic window without publishing raw data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/agent-limit-diagnosis"
          start_time="$(( ($(date +%s) - 21600) * 1000 ))"
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_diagnostic"' --query 'events[].message' --output json \
            > "$RUNNER_TEMP/agent-limit-diagnosis/diagnostics.json"
          aws logs filter-log-events --log-group-name "$AGENT_STREAM_LOG_GROUP" --start-time "$start_time" \
            --filter-pattern '"agent_stream"' --query 'events[].message' --output json \
            > "$RUNNER_TEMP/agent-limit-diagnosis/streams.json"
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const dir = process.env.RUNNER_TEMP + '/agent-limit-diagnosis';
          function decode(text) {
            if (typeof text !== 'string') return;
            for (const candidate of [text, text.slice(Math.max(0, text.indexOf('{')))]) {
              try {
                const value = JSON.parse(candidate);
                if (!value || typeof value !== 'object' || Array.isArray(value)) continue;
                if (typeof value.message === 'string') return decode(value.message) ?? value;
                return value;
              } catch {}
            }
          }
          const read = name => JSON.parse(readFileSync(`${dir}/${name}.json`, 'utf8')).map(decode).filter(Boolean);
          const diagnostics = read('diagnostics').filter(x => x.event === 'agent_diagnostic');
          const streams = read('streams').filter(x => x.eventSource === 'agent_stream');
          const safe = x => typeof x === 'string' && /^[a-z0-9_-]{1,64}$/.test(x) ? x : 'unknown';
          const time = x => typeof x === 'string' && Number.isFinite(Date.parse(x)) ? new Date(x).toISOString() : null;
          const mode = x => typeof x === 'string' && /^(?:v2:(?:agent_invoke|intent_state|read_tool|runtime_projection|runner):(?:abort|timeout|provider|validation|unknown)|v2:publication:(?:incomplete_execution|missing_reply_proposal|missing_structured_output|evidence_collision|response_budget|invalid_claim_binding|invalid_proposal|missing_evidence|ineligible_evidence|invalid_field|known_condition|operation_available|invalid_receipt|unsafe_content)|delivery:(?:full|partial|degraded):verified_projection)$/.test(x) ? x : 'not_recorded';
          const stopReasons = new Set(['endTurn','toolUse','stopSequence','limitTurns','limitTotalTokens','limitOutputTokens','maxTokens','modelContextWindowExceeded','cancelled']);
          const byExecution = new Map();
          for (const event of diagnostics) {
            if (typeof event.executionId !== 'string') continue;
            const group = byExecution.get(event.executionId) ?? [];
            group.push(event);
            byExecution.set(event.executionId, group);
          }
          console.log('## Existing production diagnostics — last six hours');
          console.log('Read-only snapshot. No deployment, model invocation, state reads or state writes.');
          console.log('Execution labels below are local ordinals, not stored request or user identifiers.');
          const groups = [...byExecution.values()].sort((a,b) => String(time(a[0]?.occurredAt)).localeCompare(String(time(b[0]?.occurredAt))));
          for (const [index, events] of groups.entries()) {
            const dates = events.map(x => time(x.occurredAt)).filter(Boolean).sort();
            const runtime = events.filter(x => x.phase === 'runtime').at(-1);
            const save = events.filter(x => x.phase === 'save').at(-1);
            const counts = {};
            for (const key of ['modelCalls','toolCalls','inputTokens','outputTokens','totalTokens']) {
              const value = runtime?.counts?.[key];
              counts[key] = Number.isSafeInteger(value) && value >= 0 ? value : null;
            }
            console.log(JSON.stringify({ executionOrdinal: index + 1,
              firstDiagnosticUtc: dates[0] ?? null, lastDiagnosticUtc: dates.at(-1) ?? null,
              diagnosticSpanMs: dates.length > 1 ? Date.parse(dates.at(-1)) - Date.parse(dates[0]) : null,
              toolsCompleted: events.filter(x => x.phase === 'tool' && x.reason === 'completed').length,
              toolsFailed: events.filter(x => x.phase === 'tool' && x.reason === 'failed').length,
              runtimeReason: runtime ? safe(runtime.reason) : 'not_recorded',
              runtimeMode: mode(runtime?.mode),
              sdkStopReason: stopReasons.has(runtime?.stopReason) ? runtime.stopReason : 'not_recorded',
              saveReason: save ? safe(save.reason) : 'not_recorded', counts }));
          }
          const byStream = new Map();
          for (const event of streams) {
            const key = safe(event.event);
            const row = byStream.get(key) ?? { event: key, count: 0, maxLatencyMs: null };
            row.count++;
            if (Number.isFinite(event.latencyMs) && event.latencyMs >= 0) row.maxLatencyMs = Math.max(row.maxLatencyMs ?? 0, Math.round(event.latencyMs));
            byStream.set(key,row);
          }
          console.log(JSON.stringify({ executionCount: groups.length, streams: [...byStream.values()] }));
          NODE
      - name: Remove raw diagnostic files
        if: always()
        run: rm -rf "$RUNNER_TEMP/agent-limit-diagnosis"
