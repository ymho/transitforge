name: Agent Eval / Model Comparison

on:
  push:
    branches: [fix/hotel-selection-identity]

permissions:
  contents: read

jobs:
  hotel-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: jp.anthropic.claude-sonnet-4-6
      AGENT_V2_LIVE: "true"
    steps:
      - name: Check out evaluated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve dedicated evaluation role
        id: eval-role
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "role_arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"
      - name: Configure evaluation credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ steps.eval-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Install dependencies
        run: npm ci
      - name: Verify hotel selections with actual Bedrock
        run: npx vitest run --root . backend/agent-api/src/composition/strands-accommodation-selection.test.ts --maxWorkers=1
