name: Agent v2 / Dialogue output verification
# bounded free conversation rerun after deterministic contract update
on:
  push:
    branches: [feat/agent-v2-party-cohorts-729]
    paths: [.github/workflows/issue729-live.yml]
permissions:
  contents: read
concurrency:
  group: transitforge-strands-v2-live
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      MODEL_ID: jp.amazon.nova-2-lite-v1:0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Deterministic boundaries
        run: |
          npm ci
          npm run typecheck:tools
          npm run test:agent:v2
      - name: Resolve evaluation role
        id: role
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?}"
          account_id="${AWS_DEPLOY_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          echo "arn=arn:aws:iam::${account_id}:role/transitforge-dev-github-agent-eval" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
      - name: Single bounded what-if diagnostic
        env:
          AGENT_V2_LIVE: 'true'
        run: |
          mkdir -p .artifacts/dialogue-output
          echo 'One synthetic turn, at most 6 model calls, 60 seconds; no production state or external Providers.' >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --root . backend/agent-api/src/composition/strands-dialogue-output-live.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.artifacts/dialogue-output/baseline.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dialogue-output-${{ github.run_id }}
          path: .artifacts/dialogue-output
          retention-days: 7
          if-no-files-found: warn
