name: Agent / 758 isolated reproduction
on:
  push:
    branches: [debug/758-repro-results]
    paths: [.github/workflows/issue758-repro.yml, backend/agent-api/src/composition/strands-production-repro-live.test.ts]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["lambda:GetFunctionConfiguration"],"Resource":"arn:aws:lambda:ap-northeast-1:*:function:transitforge-dev-agent-stream"},
              {"Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:Retrieve","bedrock:Rerank","secretsmanager:GetSecretValue","s3:GetObject"],"Resource":"*"},
              {"Effect":"Deny","Action":["dynamodb:*","lambda:InvokeFunction"],"Resource":"*"}
            ]}
      - name: Load configuration into private temporary file
        run: |
          umask 077
          aws lambda get-function-configuration --function-name transitforge-dev-agent-stream --query Environment.Variables --output json | jq '. + {AWS_REGION:"ap-northeast-1"}' > "$RUNNER_TEMP/repro-env.json"
      - name: Reproduce one isolated turn with production Providers
        env:
          AGENT_V2_PRODUCTION_REPRO: 'true'
          REPRO_ENV_PATH: ${{ runner.temp }}/repro-env.json
        run: npx vitest run backend/agent-api/src/composition/strands-production-repro-live.test.ts --reporter=verbose
      - name: Remove configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/repro-env.json"

# Verify request-scoped completion and unknown-condition semantics.
