name: OTP / Promote graph to dev

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/otp-promote-graph.yml

permissions:
  actions: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Promote the verified graph manifest
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_GRAPH_VERSION: 20260928T112407Z-4206cdd9d58c
          OTP_GRAPH_SHA256: 4206cdd9d58c1909bf54435db3d6f1f6b7b0824045c8a589f77add9599d485a0
        run: |
          set -euo pipefail

          upsert_environment_variable() {
            name="$1"
            value="$2"
            endpoint="repos/$GITHUB_REPOSITORY/environments/dev/variables/$name"
            if gh api --method PATCH "$endpoint" -f "name=$name" -f "value=$value" > /dev/null 2>&1; then
              return
            fi
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/environments/dev/variables" \
              -f "name=$name" \
              -f "value=$value" \
              > /dev/null
          }

          upsert_environment_variable OTP_GRAPH_VERSION "$OTP_GRAPH_VERSION"
          upsert_environment_variable OTP_GRAPH_SHA256 "$OTP_GRAPH_SHA256"
          upsert_environment_variable OTP_ROUTE_SERVICE_ENABLED "true"

          {
            echo "### OTP graph promoted to dev"
            printf -- '- Version: `%s`\n' "$OTP_GRAPH_VERSION"
            printf -- '- SHA-256: `%s`\n' "$OTP_GRAPH_SHA256"
            echo "- Route service: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
