name: CI / Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      visual_comparison:
        description: Capture v6 and implementation at 1440px and 390px (development preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix /tmp/visual-tools --no-save playwright@1.63.0
          /tmp/visual-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture reference and implementation
        env:
          PLAYWRIGHT_MODULE: /tmp/visual-tools/node_modules/playwright/index.mjs
        run: |
          npm run dev --workspace @raiquora/frontend -- --host 127.0.0.1 --port 5178 --strictPort > /tmp/visual-vite.log 2>&1 &
          node tools/capture_product_design.mjs .artifacts/product-design
      - name: Upload visual comparison (not a deployment)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-design-${{ github.sha }}
          path: .artifacts/product-design/
          if-no-files-found: error
          retention-days: 30
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check architecture boundaries
        run: npm run architecture:check

      - name: Run TypeScript tests
        run: npm test

      - name: Build viewer
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: test-token-for-build-only

      - name: Check viewer bundle budget
        run: npm run bundle:check

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Lambda package
        run: npm run lambda:check --workspace @raiquora/agent-api

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore Terraform provider cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-1.12.2-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-1.12.2-

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Terraform dev environment
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_github_repository: example/transitforge
          TF_VAR_data_builder_github_oidc_subject: repo:example@12345/transitforge-data-builder@67890:environment:dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
