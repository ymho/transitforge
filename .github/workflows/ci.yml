name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm test

      - name: Build viewer
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: test-token-for-build-only

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Terraform dev environment
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_github_repository: example/transitforge
          TF_VAR_data_builder_github_oidc_subject: repo:example@12345/transitforge-data-builder@67890:environment:dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: transitforge-dev
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_basic_auth_credentials_sha256: ${{ secrets.BASIC_AUTH_CREDENTIALS_SHA256 }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_data_builder_github_oidc_subject: ${{ vars.DATA_BUILDER_GITHUB_OIDC_SUBJECT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment inputs
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?dev Environment variable AWS_DEPLOY_ROLE_ARN is required}"
          : "${TF_STATE_BUCKET:?dev Environment variable TF_STATE_BUCKET is required}"
          : "${TF_VAR_data_builder_github_oidc_subject:?dev Environment variable DATA_BUILDER_GITHUB_OIDC_SUBJECT is required}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build viewer with deployment token
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Apply Terraform
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform plan -out=dev.tfplan
          terraform apply -auto-approve dev.tfplan

      - name: Read deployment outputs
        id: terraform
        working-directory: infra/terraform/environments/dev
        run: |
          echo "website_bucket=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Deploy viewer assets
        run: |
          aws s3 sync dist "s3://${{ steps.terraform.outputs.website_bucket }}/" \
            --delete \
            --exclude "viewer-input/*" \
            --exclude "api/*"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.terraform.outputs.distribution_id }}" \
            --paths "/*"
