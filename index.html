<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111d" />
    <title>TransitForge</title>
  </head>
  <body>
    <main id="app" data-loading-state="loading" data-ui-color-mode="day" data-display-mode="simulation" aria-busy="true">
      <section id="loading-screen" class="loading-screen" role="status" aria-live="polite" aria-atomic="true">
        <div class="loading-screen-content">
          <p class="loading-screen-brand">TransitForge</p>
          <p id="loading-screen-message" class="loading-screen-message">地図を読み込んでいます。</p>
          <div class="loading-screen-progress" aria-hidden="true"><span></span></div>
          <button id="loading-screen-retry" class="loading-screen-retry" type="button" hidden>再読み込み</button>
        </div>
      </section>
      <div id="map" aria-label="TransitForge 3D map"></div>
      <section id="control-panel" class="hud" aria-label="表示日時パネル">
        <div id="date-time-panel" class="time-control">
          <label class="date-time-display" aria-label="表示日時" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false">
            <span id="date-time-date" class="date-time-date">----</span>
            <time id="date-time-clock" class="date-time-clock">--:--:--</time>
            <input id="date-time-input" class="date-time-input" type="datetime-local" step="1" aria-label="表示日時を変更" tabindex="-1" disabled />
          </label>
          <input id="display-time" type="hidden" min="240" max="1440" value="720" />
        </div>
        <p id="map-status">Mapboxを初期化しています。</p>
      </section>
      <svg class="map-tool-symbols" aria-hidden="true">
        <symbol id="icon-play" viewBox="0 0 20 20"><path d="M7 5.5 15 10l-8 4.5z" /></symbol>
        <symbol id="icon-pause" viewBox="0 0 20 20"><path d="M6.5 5h2.25v10H6.5zm4.75 0h2.25v10h-2.25z" /></symbol>
        <symbol id="icon-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 6v4l3 2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-cloud" viewBox="0 0 20 20"><path d="M5.2 14.5a3.2 3.2 0 0 1-.3-6.4A5.1 5.1 0 0 1 14.7 7a3.8 3.8 0 0 1 .2 7.5z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"/></symbol>
        <symbol id="icon-rain" viewBox="0 0 20 20"><path d="M5.2 11.8a3 3 0 0 1-.3-6 5.1 5.1 0 0 1 9.8-1.1 3.6 3.6 0 0 1 .2 7.1zM6.5 14l-1 2.5M10.5 14l-1 2.5M14.5 14l-1 2.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-snow" viewBox="0 0 20 20"><path d="M10 3v14M4 6.5l12 7M4 13.5l12-7M7.8 4.3 10 5.6l2.2-1.3M7.8 15.7 10 14.4l2.2 1.3M4.1 9l2.2.1.1-2.3M15.9 11l-2.2-.1-.1 2.3M4.1 11l2.2-.1.1 2.3M15.9 9l-2.2.1-.1-2.3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"/></symbol>
        <symbol id="icon-congestion" viewBox="0 0 20 20"><path d="M4.5 15.5v-3h2v3zm4.5 0V9h2v6.5zm4.5 0V5h2v10.5z"/><path d="M3.5 16.5h13" fill="none" stroke="currentColor" stroke-linecap="round"/></symbol>
        <symbol id="icon-arc" viewBox="0 0 20 20"><path d="M3.5 14.5c2.5-7.5 10.5-7.5 13 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/><circle cx="3.5" cy="14.5" r="1.25"/><circle cx="16.5" cy="14.5" r="1.25"/></symbol>
        <symbol id="icon-route" viewBox="0 0 20 20"><circle cx="4.25" cy="14.75" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15.75" cy="5.25" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.2 14.4c4.8-.7 2.7-7.5 7.55-8.7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/><path d="m11.8 4.7 2.1.9-1.3 1.85" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35"/></symbol>
        <symbol id="icon-train" viewBox="0 0 20 20"><rect x="5" y="2.8" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 17.2 9 14.8m3.8 2.4L11 14.8M7.4 7h5.2M7.4 10.8h.1m5.1 0h.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-user" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.3 17c.7-3 2.6-4.5 5.7-4.5s5 1.5 5.7 4.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-ai-station" viewBox="0 0 20 20"><path d="M3.25 5.5h9.5a2 2 0 0 1 2 2v4.25a2 2 0 0 1-2 2H8l-3.5 2v-2H3.25a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.45"/><path d="M15.6 1.8v3.4M13.9 3.5h3.4M11.1 8.2l.45 1.05 1.05.45-1.05.45-.45 1.05-.45-1.05-1.05-.45 1.05-.45z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.15"/></symbol>
        <symbol id="icon-ai-sparkles" viewBox="0 0 20 20"><path d="M9.2 2.3c.55 3.8 2.7 5.95 6.5 6.5-3.8.55-5.95 2.7-6.5 6.5-.55-3.8-2.7-5.95-6.5-6.5 3.8-.55 5.95-2.7 6.5-6.5Z"/><path d="M15.6 1.8c.15 1.25.85 1.95 2.1 2.1-1.25.15-1.95.85-2.1 2.1-.15-1.25-.85-1.95-2.1-2.1 1.25-.15 1.95-.85 2.1-2.1ZM15.7 13.2c.18 1.5 1.05 2.37 2.55 2.55-1.5.18-2.37 1.05-2.55 2.55-.18-1.5-1.05-2.37-2.55-2.55 1.5-.18 2.37-1.05 2.55-2.55Z"/></symbol>
        <symbol id="icon-send" viewBox="0 0 20 20"><path d="m3 4 14 6-14 6 2.5-6z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/><path d="M5.5 10H13" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></symbol>
        <symbol id="icon-chevron-down" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 20 20"><path d="M15.6 7.2A6 6 0 1 0 16 12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/><path d="m12.8 4.8 2.9 2.5 1.5-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></symbol>
        <symbol id="icon-share" viewBox="0 0 20 20"><path d="M10 12.8V3.5m0 0L6.8 6.7M10 3.5l3.2 3.2M5 9.8H3.8v6.7h12.4V9.8H15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></symbol>
        <symbol id="icon-digital-twin" viewBox="0 0 20 20"><path d="m10 2.7 6.4 3.4-6.4 3.4-6.4-3.4zM3.6 10l6.4 3.4 6.4-3.4M3.6 13.9l6.4 3.4 6.4-3.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.55"/></symbol>
      </svg>
      <nav id="map-tools" class="map-tools mapboxgl-ctrl mapboxgl-ctrl-group" aria-label="地図操作">
        <button id="digital-twin-mode-toggle" type="button" aria-label="デジタルツインモード" title="デジタルツインモード" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-digital-twin" /></svg></button>
        <button id="current-time-button" type="button" aria-label="現在時刻へ移動" title="現在時刻へ移動" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-clock" /></svg></button>
        <button id="play-toggle" type="button" aria-label="再生" title="再生" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-play" /></svg></button>
        <div class="playback-speed-menu">
          <button id="playback-speed-menu-toggle" class="playback-speed-menu-toggle" type="button" aria-label="再生速度を選択（現在は1倍）" title="再生速度: 1倍" aria-expanded="false" aria-controls="playback-speed-options" disabled>1×</button>
          <input id="playback-speed" type="hidden" value="0.016666666666666666" />
          <fieldset id="playback-speed-options" class="playback-speed-controls" aria-label="再生速度の選択" hidden>
            <button type="button" data-playback-speed="0.016666666666666666" data-playback-speed-label="1×" aria-label="1倍速" aria-pressed="true" disabled>1×</button>
            <button type="button" data-playback-speed="1" data-playback-speed-label="60×" aria-label="60倍速" aria-pressed="false" disabled>60×</button>
            <button type="button" data-playback-speed="10" data-playback-speed-label="600×" aria-label="600倍速" aria-pressed="false" disabled>600×</button>
            <button type="button" data-playback-speed="60" data-playback-speed-label="3600×" aria-label="3600倍速" aria-pressed="false" disabled>3600×</button>
          </fieldset>
        </div>
        <button id="congestion-toggle" type="button" aria-label="混雑表示" title="混雑表示" aria-pressed="true" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-congestion" /></svg></button>
        <button id="destination-arcs-toggle" type="button" aria-label="行先アーチ" title="行先アーチ" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-arc" /></svg></button>
        <div class="weather-menu">
          <button id="weather-menu-toggle" type="button" aria-label="天気を選択" title="天気を選択" aria-expanded="false" aria-controls="weather-options" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-sun" /></svg></button>
          <fieldset id="weather-options" class="weather-controls" aria-label="天気の選択" hidden>
            <button type="button" data-weather="clear" aria-label="晴れ" title="晴れ" aria-pressed="true" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-sun" /></svg></button>
            <button type="button" data-weather="cloudy" aria-label="曇り" title="曇り" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-cloud" /></svg></button>
            <button type="button" data-weather="rain" aria-label="雨" title="雨" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-rain" /></svg></button>
            <button type="button" data-weather="snow" aria-label="雪" title="雪" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-snow" /></svg></button>
          </fieldset>
        </div>
      </nav>
      <button
        id="ai-guide-toggle"
        class="ai-guide-toggle"
        type="button"
        aria-controls="ai-guide-panel"
        aria-expanded="false"
        aria-label="コンシェルジュを開く"
        title="コンシェルジュ"
      >
        <svg class="guide-toggle-icon ai-guide-button-icon" aria-hidden="true"><use href="#icon-ai-sparkles" /></svg>
      </button>
      <aside id="ai-guide-panel" class="ai-guide-panel" aria-label="コンシェルジュ" hidden>
        <span class="sheet-grabber" aria-hidden="true"></span>
        <header>
          <div class="guide-panel-heading">
            <img id="concierge-avatar" class="concierge-avatar" src="/assets/concierges/akari.webp" alt="あかりのアバター" />
            <div class="guide-panel-copy">
              <p id="concierge-name">あかり</p>
              <small id="concierge-role">はじめて旅のナビゲーター</small>
            </div>
          </div>
          <div class="guide-panel-actions">
            <button id="trip-plan-toggle" type="button" aria-label="旅程" title="旅程" hidden><svg aria-hidden="true"><use href="#icon-route" /></svg></button>
            <button id="journey-settings-toggle" type="button" aria-label="経路設定" title="経路設定" aria-controls="journey-settings-panel"><svg aria-hidden="true"><use href="#icon-train" /></svg></button>
            <button id="travel-profile-toggle" type="button" aria-label="プロフィール" title="プロフィール"><svg aria-hidden="true"><use href="#icon-user" /></svg></button>
            <button id="close-ai-guide" type="button" aria-label="コンシェルジュを閉じる">×</button>
          </div>
        </header>
        <ol id="ai-guide-messages" class="ai-guide-messages" aria-live="polite">
          <li id="ai-guide-context-choices" class="ai-guide-context-choices" aria-label="旅行条件の候補" hidden></li>
        </ol>
        <form id="ai-guide-form" class="ai-guide-form">
          <input
            id="ai-guide-input"
            type="text"
            maxlength="400"
            autocomplete="off"
            aria-label="コンシェルジュへの依頼"
            placeholder="列車、行き先、旅の相談を入力"
          />
          <button id="ai-guide-submit" type="submit" aria-label="送信" title="送信">
            <svg aria-hidden="true"><use href="#icon-send" /></svg>
          </button>
        </form>
      </aside>
      <aside id="trip-plan-panel" class="trip-plan-panel" aria-label="旅程" hidden>
        <header><strong>旅程</strong><button id="close-trip-plan" type="button" aria-label="旅程を閉じる">×</button></header>
        <div id="trip-plan-content" class="trip-plan-content"></div>
      </aside>
      <dialog id="travel-profile-dialog" class="travel-profile-dialog" aria-label="旅行プロフィール"></dialog>
      <dialog id="journey-settings-panel" class="journey-settings-dialog" aria-label="経路設定">
        <section>
          <header><h2>経路設定</h2><button type="button" data-close-journey-settings aria-label="閉じる">×</button></header>
          <label><span>乗換ペース</span><select id="journey-transfer-pace"><option value="hurried">急ぐ</option><option value="standard" selected>普通</option><option value="relaxed">ゆっくり</option></select></label>
          <label><span>経路の優先</span><select id="journey-ranking-preference"><option value="balanced" selected>バランス</option><option value="earliest-arrival">早く着く</option><option value="latest-departure">遅く出る</option><option value="fewest-transfers">乗換少なめ</option></select></label>
          <small>最大3回の乗換まで検索</small>
        </section>
      </dialog>
      <aside id="train-details" class="train-details" aria-live="polite" hidden>
        <button id="close-train-details" type="button" aria-label="列車詳細を閉じてフォーカスを終了する">×</button>
        <h2 id="selected-train-title"></h2>
        <div id="train-detail-tabs" class="train-detail-tabs" role="tablist" aria-label="併結列車の種別" hidden></div>
        <section class="train-timetable" aria-label="時刻表">
          <div class="train-detail-badges" aria-label="運行情報">
            <span id="selected-train-stopping" class="train-stopping-badge" hidden>停車中</span>
            <span id="selected-train-delay" class="train-delay-badge" hidden></span>
          </div>
          <ol id="selected-train-stops"></ol>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
