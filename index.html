<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111d" />
    <title>TransitForge</title>
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="TransitForge 3D map"></div>
      <section id="control-panel" class="hud" aria-label="表示日時パネル">
        <div id="date-time-panel" class="time-control" data-editing="false" tabindex="0" aria-expanded="false" aria-label="表示日時。押すと日時を変更できます">
          <output id="date-time-summary" class="date-time-summary">8月1日 12時00分00秒</output>
          <div class="date-time-steppers">
            <div class="date-time-stepper">
              <button type="button" data-date-time-unit="month" data-date-time-step="1" aria-label="月を進める" disabled>▲</button>
              <span><output id="display-month">08</output></span>
              <button type="button" data-date-time-unit="month" data-date-time-step="-1" aria-label="月を戻す" disabled>▼</button>
            </div>
            <span class="date-time-separator" aria-hidden="true">-</span>
            <div class="date-time-stepper">
              <button type="button" data-date-time-unit="day" data-date-time-step="1" aria-label="日を進める" disabled>▲</button>
              <span><output id="display-day">01</output></span>
              <button type="button" data-date-time-unit="day" data-date-time-step="-1" aria-label="日を戻す" disabled>▼</button>
            </div>
            <span class="date-time-group-separator" aria-hidden="true"></span>
            <div class="date-time-stepper">
              <button type="button" data-date-time-unit="hour" data-date-time-step="1" aria-label="時を進める" disabled>▲</button>
              <span><output id="display-hour">12</output></span>
              <button type="button" data-date-time-unit="hour" data-date-time-step="-1" aria-label="時を戻す" disabled>▼</button>
            </div>
            <span class="date-time-separator" aria-hidden="true">:</span>
            <div class="date-time-stepper">
              <button type="button" data-date-time-unit="minute" data-date-time-step="1" aria-label="分を進める" disabled>▲</button>
              <span><output id="display-minute">00</output></span>
              <button type="button" data-date-time-unit="minute" data-date-time-step="-1" aria-label="分を戻す" disabled>▼</button>
            </div>
            <span class="date-time-separator" aria-hidden="true">:</span>
            <div class="date-time-stepper">
              <button type="button" data-date-time-unit="second" data-date-time-step="1" aria-label="秒を進める" disabled>▲</button>
              <span><output id="display-second">00</output></span>
              <button type="button" data-date-time-unit="second" data-date-time-step="-1" aria-label="秒を戻す" disabled>▼</button>
            </div>
          </div>
          <input id="display-time" type="hidden" min="240" max="1440" value="720" />
        </div>
        <p id="map-status">Mapboxを初期化しています。</p>
      </section>
      <svg class="map-tool-symbols" aria-hidden="true">
        <symbol id="icon-play" viewBox="0 0 20 20"><path d="M7 5.5 15 10l-8 4.5z" /></symbol>
        <symbol id="icon-pause" viewBox="0 0 20 20"><path d="M6.5 5h2.25v10H6.5zm4.75 0h2.25v10h-2.25z" /></symbol>
        <symbol id="icon-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 6v4l3 2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-cloud" viewBox="0 0 20 20"><path d="M5.2 14.5a3.2 3.2 0 0 1-.3-6.4A5.1 5.1 0 0 1 14.7 7a3.8 3.8 0 0 1 .2 7.5z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"/></symbol>
        <symbol id="icon-rain" viewBox="0 0 20 20"><path d="M5.2 11.8a3 3 0 0 1-.3-6 5.1 5.1 0 0 1 9.8-1.1 3.6 3.6 0 0 1 .2 7.1zM6.5 14l-1 2.5M10.5 14l-1 2.5M14.5 14l-1 2.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></symbol>
        <symbol id="icon-snow" viewBox="0 0 20 20"><path d="M10 3v14M4 6.5l12 7M4 13.5l12-7M7.8 4.3 10 5.6l2.2-1.3M7.8 15.7 10 14.4l2.2 1.3M4.1 9l2.2.1.1-2.3M15.9 11l-2.2-.1-.1 2.3M4.1 11l2.2-.1.1 2.3M15.9 9l-2.2.1-.1-2.3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25"/></symbol>
        <symbol id="icon-congestion" viewBox="0 0 20 20"><path d="M4.5 15.5v-3h2v3zm4.5 0V9h2v6.5zm4.5 0V5h2v10.5z"/><path d="M3.5 16.5h13" fill="none" stroke="currentColor" stroke-linecap="round"/></symbol>
        <symbol id="icon-arc" viewBox="0 0 20 20"><path d="M3.5 14.5c2.5-7.5 10.5-7.5 13 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/><circle cx="3.5" cy="14.5" r="1.25"/><circle cx="16.5" cy="14.5" r="1.25"/></symbol>
      </svg>
      <nav id="map-tools" class="map-tools mapboxgl-ctrl mapboxgl-ctrl-group" aria-label="地図操作">
        <button id="play-toggle" type="button" aria-label="再生" title="再生" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-play" /></svg></button>
        <button id="current-time-button" type="button" aria-label="現在時刻へ移動" title="現在時刻へ移動" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-clock" /></svg></button>
        <div class="playback-speed-menu">
          <button id="playback-speed-menu-toggle" class="playback-speed-menu-toggle" type="button" aria-label="再生速度を選択（現在は1倍）" title="再生速度: 1倍" aria-expanded="false" aria-controls="playback-speed-options" disabled>1×</button>
          <input id="playback-speed" type="hidden" value="0.016666666666666666" />
          <fieldset id="playback-speed-options" class="playback-speed-controls" aria-label="再生速度の選択" hidden>
            <button type="button" data-playback-speed="0.016666666666666666" data-playback-speed-label="1×" aria-label="1倍速" aria-pressed="true" disabled>1×</button>
            <button type="button" data-playback-speed="1" data-playback-speed-label="60×" aria-label="60倍速" aria-pressed="false" disabled>60×</button>
            <button type="button" data-playback-speed="10" data-playback-speed-label="600×" aria-label="600倍速" aria-pressed="false" disabled>600×</button>
            <button type="button" data-playback-speed="60" data-playback-speed-label="3600×" aria-label="3600倍速" aria-pressed="false" disabled>3600×</button>
          </fieldset>
        </div>
        <div class="weather-menu">
          <button id="weather-menu-toggle" type="button" aria-label="天気を選択" title="天気を選択" aria-expanded="false" aria-controls="weather-options" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-sun" /></svg></button>
          <fieldset id="weather-options" class="weather-controls" aria-label="天気の選択" hidden>
            <button type="button" data-weather="clear" aria-label="晴れ" title="晴れ" aria-pressed="true" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-sun" /></svg></button>
            <button type="button" data-weather="cloudy" aria-label="曇り" title="曇り" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-cloud" /></svg></button>
            <button type="button" data-weather="rain" aria-label="雨" title="雨" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-rain" /></svg></button>
            <button type="button" data-weather="snow" aria-label="雪" title="雪" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-snow" /></svg></button>
          </fieldset>
        </div>
        <button id="congestion-toggle" type="button" aria-label="混雑表示" title="混雑表示" aria-pressed="true" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-congestion" /></svg></button>
        <button id="destination-arcs-toggle" type="button" aria-label="行先アーチ" title="行先アーチ" aria-pressed="false" disabled><svg class="map-tool-icon" aria-hidden="true"><use href="#icon-arc" /></svg></button>
      </nav>
      <button
        id="ai-guide-toggle"
        class="ai-guide-toggle"
        type="button"
        aria-controls="ai-guide-panel"
        aria-expanded="false"
      >AI案内</button>
      <aside id="ai-guide-panel" class="ai-guide-panel" aria-label="AI運行観察員" hidden>
        <header>
          <div>
            <p>AI運行観察員</p>
            <small>地図を操作してご案内します</small>
          </div>
          <span class="ai-guide-status">履歴分析対応</span>
          <button id="close-ai-guide" type="button" aria-label="AI運行観察員を閉じる">×</button>
        </header>
        <ol id="ai-guide-messages" class="ai-guide-messages" aria-live="polite">
          <li class="ai-guide-message ai-guide-message-assistant">列車・時刻・カメラに加え、天気、混雑棒、目的地アーチも操作できます。</li>
        </ol>
        <div class="ai-guide-suggestions" aria-label="質問例">
          <button type="button" data-prompt="18時30分にして">
            18時30分にする
          </button>
          <button type="button" data-prompt="京都へ向かう特急を見せて">
            京都方面の特急
          </button>
          <button type="button" data-prompt="18時30分ごろ京都に着く特急はありますか">
            京都18時30分ごろ着
          </button>
          <button type="button" data-prompt="はるかを見せて">
            はるかを見る
          </button>
          <button type="button" data-prompt="今日の混雑のピークは？">
            今日の混雑ピーク
          </button>
          <button type="button" data-prompt="今日の1時間ごとの混雑推移を教えて">
            今日の時間別混雑
          </button>
          <button type="button" data-prompt="今日混んでいた路線と列車を教えて">
            今日の混雑路線・列車
          </button>
          <button type="button" data-prompt="現在遅れている列車を教えて">
            現在の列車遅延
          </button>
          <button type="button" data-prompt="雨にして">
            雨にする
          </button>
          <button type="button" data-prompt="目的地アーチを表示して">
            目的地アーチ
          </button>
        </div>
        <form id="ai-guide-form" class="ai-guide-form">
          <input
            id="ai-guide-input"
            type="text"
            maxlength="400"
            autocomplete="off"
            aria-label="AI運行観察員への依頼"
            placeholder="見たい列車や場面を入力"
          />
          <button id="ai-guide-submit" type="submit">送信</button>
        </form>
      </aside>
      <aside id="train-details" class="train-details" aria-live="polite" hidden>
        <button id="close-train-details" type="button" aria-label="列車詳細を閉じてフォーカスを終了する">×</button>
        <h2 id="selected-train-title"></h2>
        <dl>
          <div><dt>列車番号</dt><dd id="selected-train-number"></dd></div>
          <div><dt>種別</dt><dd id="selected-train-type"></dd></div>
          <div><dt>区間</dt><dd id="selected-train-route"></dd></div>
          <div><dt>遅延</dt><dd id="selected-train-delay">取得中</dd></div>
        </dl>
        <button id="show-coupled-train" class="show-coupled-train" type="button" hidden></button>
        <section class="train-timetable" aria-labelledby="train-timetable-title">
          <h3 id="train-timetable-title">停車駅・時刻</h3>
          <ol id="selected-train-stops"></ol>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
